# apply
#
# Runs when a pull request that touched live/ is merged to main. Calls the
# reusable apply workflow in nrit-azure-pipelines, which logs in to the customer
# tenant with OIDC (the apply identity, Owner) and applies the foundation stack.
#
# The apply waits on the apply environment's required reviewers before it runs.
# Approve the deployment on the run's page to release it.
#
# The reusable workflow is pinned to the same tag the bootstrap pinned the
# federated credential to. Do not change the @ref or the working_directory
# without re-running the bootstrap: the OIDC subject embeds both.

name: apply

on:
  push:
    branches: [main]
    paths: ["live/**"]

permissions:
  contents: read
  id-token: write

jobs:
  foundation:
    uses: nrit-solutions/nrit-azure-pipelines/.github/workflows/terragrunt-apply.yml@v0.1.2
    with:
      working_directory: live/tenant/_global/caf-platform-foundation
      runs_on: ${{ vars.RUNNER_LABEL }}
      catalog_app_id: ${{ vars.CATALOG_APP_ID }}
    secrets:
      catalog_app_private_key: ${{ secrets.CATALOG_APP_PRIVATE_KEY }}

  # Connectivity applies after the foundation, so the management group hierarchy
  # and the apply identity's role assignments are in place before resources land
  # in the connectivity subscription.
  connectivity:
    needs: foundation
    uses: nrit-solutions/nrit-azure-pipelines/.github/workflows/terragrunt-apply.yml@v0.1.2
    with:
      working_directory: live/platform/connectivity/sub-connectivity/westeurope/caf-connectivity-hub
      runs_on: ${{ vars.RUNNER_LABEL }}
      catalog_app_id: ${{ vars.CATALOG_APP_ID }}
    secrets:
      catalog_app_private_key: ${{ secrets.CATALOG_APP_PRIVATE_KEY }}
