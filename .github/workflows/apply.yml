# apply
#
# Applies the routine, lower-scope platform workloads on push to main. A detect
# job asks the reusable terragrunt-affected workflow which components the push
# changed; then a matrix applies only those, one at a time.
#
# The foundation is excluded twice over. The path filter below keeps this
# workflow to connectivity and landing zones, so a change under
# live/platform/management/** never triggers it. And detect passes
# exclude_prefixes: live/platform/management/, so even a mixed commit that also
# touches connectivity can never pull the foundation into this auto-apply. The
# foundation is applied only by the manual apply-foundation workflow.
#
# The apply job keeps calling the pinned terragrunt-apply workflow at v0.4.2
# through the apply environment: that tag and environment are baked into the
# apply identity's OIDC subject, so do not change them or the working_directory
# shape without re-running the bootstrap (see ADR 11).

name: apply

on:
  push:
    branches: [main]
    paths:
      - "live/platform/connectivity/**"
      - "live/landingzones/**"

permissions:
  contents: read
  id-token: write

jobs:
  detect:
    uses: nrit-solutions/nrit-azure-pipelines/.github/workflows/terragrunt-affected.yml@v0.2.0
    with:
      base_ref: ${{ github.event.before }}
      head_ref: ${{ github.sha }}
      runs_on: ${{ vars.RUNNER_LABEL }}
      exclude_prefixes: live/platform/management/

  apply:
    needs: detect
    if: needs.detect.outputs.dirs != '[]'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        working_directory: ${{ fromJSON(needs.detect.outputs.dirs) }}
    uses: nrit-solutions/nrit-azure-pipelines/.github/workflows/terragrunt-apply.yml@v0.4.2
    with:
      working_directory: ${{ matrix.working_directory }}
      runs_on: ${{ vars.RUNNER_LABEL }}
      catalog_app_client_id: ${{ vars.CATALOG_APP_CLIENT_ID }}
    secrets:
      catalog_app_private_key: ${{ secrets.CATALOG_APP_PRIVATE_KEY }}
