name: lint

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# Runs the same hooks as the local pre-commit install, so a commit made without
# them (or with --no-verify) is caught before it reaches main. The hooks fail the
# job: formatting and the repository invariants are objective and cheap to fix.
# The changelog reminder rides along as a step rather than its own workflow,
# because a check row per pull request is too much surface for a warning that
# never blocks. It warns; only the hooks below fail.
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Changelog reminder
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          if grep -qvE '\.md$' <<<"$changed" && ! grep -qx 'CHANGELOG.md' <<<"$changed"; then
            echo "::warning file=CHANGELOG.md::This PR changes code but not CHANGELOG.md. Append to [Unreleased], or ignore this if the change is invisible to operators."
          fi

      # installs everything in mise.toml: terraform, terragrunt, tflint,
      # checkov, and pre-commit itself, at the pinned versions
      - uses: jdx/mise-action@v4.2.3
        with:
          cache: true

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - run: pre-commit run --all-files --show-diff-on-failure --color=always
