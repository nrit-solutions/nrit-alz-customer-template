name: lint

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# Runs the same hooks as the local pre-commit install, so a commit made without
# them (or with --no-verify) is caught before it reaches main. Unlike the
# changelog reminder and the plan-time policy gates, this one fails: formatting
# and the repository invariants are objective and cheap to fix.
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # installs everything in mise.toml: terraform, terragrunt, tflint,
      # checkov, and pre-commit itself, at the pinned versions
      - uses: jdx/mise-action@v4.2.3
        with:
          cache: true

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - run: pre-commit run --all-files --show-diff-on-failure --color=always
