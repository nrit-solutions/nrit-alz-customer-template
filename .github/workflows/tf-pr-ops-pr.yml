# PR caller for tf-pr-ops: the pull_request path in one dispatch job, gated
# by this repository's own pre-commit hooks. One version pin: the dispatch
# action knows its own ref.
name: tf-pr-ops

on:
  pull_request:
    # closed dispatches an unlock so the PR's cross-PR unit locks release.
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write
  checks: write          # the engine-authored check runs, merge gate included
  actions: write         # dispatch the ops workflow

jobs:
  # First and gating: a failed lint stops dispatch, so no plan runs and no
  # report lands on a PR that fails its own hooks; merge stays blocked
  # because the required merge gate is never created. Runs the same hooks as
  # the local pre-commit install, so a commit made without them (or with
  # --no-verify) is caught before it reaches main. The changelog reminder
  # rides along as a step: it warns, only the hooks fail.
  pre-commit:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Changelog reminder
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          if grep -qvE '\.md$' <<<"$changed" && ! grep -qx 'CHANGELOG.md' <<<"$changed"; then
            echo "::warning file=CHANGELOG.md::This PR changes code but not CHANGELOG.md. Append to [Unreleased], or ignore this if the change is invisible to operators."
          fi

      # installs everything in mise.toml: terraform, terragrunt, tflint,
      # checkov, and pre-commit itself, at the pinned versions
      - uses: jdx/mise-action@v4.2.3
        with:
          cache: true

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - run: pre-commit run --all-files --show-diff-on-failure --color=always

  # The closed/unlock path is exempt from the lint gate: a PR closed with
  # failing lint still releases its locks.
  dispatch:
    needs: pre-commit
    if: >-
      !cancelled() &&
      (github.event.action == 'closed' || needs.pre-commit.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: nrit-solutions/nrit-tf-pr-ops/.github/actions/dispatch@v3.0.2
        with:
          checks-app-client-id: ${{ vars.TFPR_CHECKS_APP_CLIENT_ID }}
          checks-app-private-key: ${{ secrets.TFPR_CHECKS_APP_PRIVATE_KEY }}
          allow-unreviewed-apply: ${{ vars.TFPR_ALLOW_UNREVIEWED_APPLY }}
