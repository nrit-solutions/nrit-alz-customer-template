# Canonical caller for the reusable terraform-pr-ops workflow.
# Copy to a consumer repo as .github/workflows/terraform-pr-ops.yml. This file is
# stable: engine changes never need a caller edit. Bump the two version pins
# (the uses: ref and engine_ref) together to move to a new engine release.
name: tf-pr-ops

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      command:
        type: choice
        options: [plan, apply]
        default: plan
      project:
        required: false
      # Set by the engine when it dispatches a pull_request plan back through
      # this workflow; never set them by hand.
      pr_number:
        required: false
      head_sha:
        required: false
      dispatch_run_id:
        required: false
      dispatch_run_number:
        required: false

# The caller grants the ceiling of permissions the reusable workflow's jobs use.
permissions:
  contents: read
  pull-requests: write
  checks: write
  statuses: write
  id-token: write
  actions: write # the pull_request path dispatches its plan work

jobs:
  engine:
    uses: nrit-solutions/nrit-tf-pr-ops/.github/workflows/terraform-pr-ops.yml@v2.1.0
    with:
      command: ${{ inputs.command || 'plan' }}
      project: ${{ inputs.project || '' }}
      pr_number: ${{ inputs.pr_number || '' }}
      head_sha: ${{ inputs.head_sha || '' }}
      dispatch_run_id: ${{ inputs.dispatch_run_id || '' }}
      dispatch_run_number: ${{ inputs.dispatch_run_number || '' }}
      engine_ref: v2.1.0 # must match the uses: ref above
    secrets: inherit
