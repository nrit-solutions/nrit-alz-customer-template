# What can the self-hosted runner actually reach?
#
# The runner sits in a network-scoped Container Apps environment, and several
# tools in the plan path call out to the internet whether or not anyone decided
# they should. A tool that cannot reach its endpoint does not fail loudly, it
# degrades: checkov drops every guideline link, infracost skips pricing. Both
# still report success, so the only way to know is to ask.
#
# Dispatch only, and it reports rather than fails. A blocked endpoint is
# information, not a broken build.
name: runner-egress-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Probe the endpoints the plan path depends on
        run: |
          probe() {
            local label="$1" url="$2" note="$3" out code elapsed bytes
            out="$(curl -sS -o /dev/null -w '%{http_code} %{time_total} %{size_download}' \
              --max-time 20 "$url" 2>/dev/null)" || out="000 blocked 0"
            read -r code elapsed bytes <<<"$out"
            printf '| `%s` | %s | %s | %s | %s |\n' "$label" "$code" "$elapsed" "$bytes" "$note"
          }
          {
            echo '## Runner egress'
            echo
            echo "runner label: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}"
            echo
            echo '| endpoint | status | seconds | bytes | what a failure degrades |'
            echo '|---|---|---|---|---|'
            probe 'api0.prismacloud.io' \
              'https://api0.prismacloud.io/bridgecrew/api/v2/guidelines' \
              'checkov guideline links render dead'
            probe 'pricing.api.infracost.io' \
              'https://pricing.api.infracost.io/health' \
              'infracost cost estimates'
            probe 'registry.terraform.io' \
              'https://registry.terraform.io/.well-known/terraform.json' \
              'module and provider downloads'
            probe 'results-receiver.actions.githubusercontent.com' \
              'https://results-receiver.actions.githubusercontent.com/' \
              'Actions cache and artifact lookups (tool and provider caches miss)'
            probe 'productionresultssa2.blob.core.windows.net' \
              'https://productionresultssa2.blob.core.windows.net/' \
              'Actions cache and artifact payloads (*.blob.core.windows.net, the account number varies)'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The probe above says whether the endpoint answers. This says whether
      # checkov actually ended up with the mapping, which is the question the
      # rendering work in nrit-tf-pr-ops#116 turns on.
      - name: Ask checkov whether its findings carry guideline URLs
        run: |
          if ! command -v checkov >/dev/null 2>&1; then
            echo 'checkov is not on this runner' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          checkov --version | tee -a "$GITHUB_STEP_SUMMARY"
          printf 'resource "azurerm_storage_account" "t" {\n  name = "t"\n}\n' >/tmp/probe.tf
          checkov -f /tmp/probe.tf --compact --quiet -o json 2>/dev/null \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); r=d if isinstance(d,list) else [d]; f=[c for e in r for c in e.get("results",{}).get("failed_checks",[])]; h=[c for c in f if c.get("guideline")]; print(f"failed checks: {len(f)}, carrying a guideline URL: {len(h)}"); print("guidelines reachable from this runner" if h else "NO guideline URLs: the Prisma Cloud fetch did not land")' \
            | tee -a "$GITHUB_STEP_SUMMARY"
