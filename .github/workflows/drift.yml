# drift
#
# Scheduled drift detection. Once a day (and on demand) a discover job finds
# every Terragrunt stack in the repository; a matrix then checks each one against
# the deployed tenant with the reusable terragrunt-drift workflow. Each stack
# that no longer matches its committed configuration opens (or refreshes) a
# GitHub Issue; a stack that comes back clean closes its issue automatically.
#
# The check is read only: it runs the plan (Reader) identity through the plan
# environment, the same identity the pull-request plan uses, so it can never
# change the tenant. It pins the reusable workflow at v0.3.0, the tag the drift
# federated credential is bound to. Do not change the @ref or the plan
# environment without re-running the bootstrap (its drift_workflow_ref): the OIDC
# subject embeds both (see ADR 11).
#
# discover does no cloud login (it only lists files), so it needs no OIDC.

name: drift

on:
  schedule:
    # Daily at 06:17 UTC. Off the hour to avoid the scheduling congestion GitHub
    # warns about on exact-hour crons.
    - cron: "17 6 * * *"
  workflow_dispatch:

# Permissions are set per job, not workflow-wide. The discover job does no cloud
# login, so it must not hold id-token: write: this repository customizes the OIDC
# subject to require an `environment` claim, and a job that can request a token
# but sets no environment fails at startup ("the claim 'environment' cannot be
# null"). Only the drift job (which calls the reusable workflow that sets
# environment: plan) gets the token and issue permissions.

jobs:
  discover:
    name: discover stacks
    runs-on: ${{ vars.RUNNER_LABEL }}
    permissions:
      contents: read
    outputs:
      dirs: ${{ steps.find.outputs.dirs }}
    steps:
      - uses: actions/checkout@v7

      - name: Find every stack
        id: find
        run: |
          set -euo pipefail
          # Every stack is a directory containing a terragrunt.stack.hcl. Emit a
          # JSON array of those directories for the matrix. Paths are plain and
          # need no JSON escaping.
          dirs="["
          sep=""
          while IFS= read -r f; do
            [ -z "${f}" ] && continue
            d="$(dirname "${f}")"
            dirs="${dirs}${sep}\"${d}\""
            sep=","
          done < <(find live -name terragrunt.stack.hcl | sort)
          dirs="${dirs}]"
          echo "Stacks: ${dirs}"
          echo "dirs=${dirs}" >> "${GITHUB_OUTPUT}"

  drift:
    needs: discover
    if: needs.discover.outputs.dirs != '[]'
    permissions:
      contents: read
      id-token: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        working_directory: ${{ fromJSON(needs.discover.outputs.dirs) }}
    uses: nrit-solutions/nrit-azure-pipelines/.github/workflows/terragrunt-drift.yml@v0.4.0
    with:
      working_directory: ${{ matrix.working_directory }}
      runs_on: ${{ vars.RUNNER_LABEL }}
      catalog_app_client_id: ${{ vars.CATALOG_APP_CLIENT_ID }}
      # The foundation is applied by hand, not on merge, so a diff there may be a
      # pending apply rather than tenant drift; flag it so the issue says so.
      manual_apply: ${{ startsWith(matrix.working_directory, 'live/tenant/') }}
    secrets:
      catalog_app_private_key: ${{ secrets.CATALOG_APP_PRIVATE_KEY }}
